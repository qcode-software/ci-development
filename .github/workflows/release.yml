name: "Release"

# Reusable release workflow. Composes the shared actions in
# .github/actions/ in a single job so build artefacts share one filesystem.
#
# Types:
#   tag-only    version, GitHub release (optionally with deploy notes)
#   debian      debian package from a deb/ tree, release, apt upload
#   debian-app  as debian, plus a source archive attached to the release
#   tcl-module  Tcl module, source archive, debian package, release, apt upload
#
# No hostnames live here. The apt server for an estate comes from the
# organisation variables APT_REMOTE_{USER,HOST,DIR}_<ESTATE>.

on:
  workflow_call:
    inputs:
      type:
        description: "One of: tag-only, debian, debian-app, tcl-module"
        required: true
        type: string
      estate:
        description: "Apt estate (tlc, mla or qcode). Required for every type except tag-only"
        required: false
        type: string
        default: ""
      deploy_notes:
        description: "Append .github/deploy.md to the release notes"
        required: false
        type: boolean
        default: false
      source_dir:
        description: "debian, debian-app: directory holding DEBIAN/control.template"
        required: false
        type: string
        default: "deb"
      archive_directory:
        description: "debian-app: directory to archive"
        required: false
        type: string
        default: "."
      module_name:
        description: "tcl-module: Tcl package name"
        required: false
        type: string
        default: ""
      tcl_source_directory:
        description: "tcl-module: directory searched for .tcl files"
        required: false
        type: string
        default: "tcl"
      maintainer:
        description: "tcl-module: Maintainer field"
        required: false
        type: string
        default: "hackers@qcode.co.uk"
      description:
        description: "tcl-module: package description. Defaults to '<repository> debian package.'"
        required: false
        type: string
        default: ""
      depends:
        description: "tcl-module: Depends field (comma separated)"
        required: false
        type: string
        default: ""
      distribution:
        description: "Apt distribution to include the package in"
        required: false
        type: string
        default: "bookworm"
    secrets:
      DEB_PRIVATE_KEY:
        description: "SSH key for the qcode estate"
        required: false
      MLA_DEB_PRIVATE_KEY:
        description: "SSH key for the mla estate"
        required: false
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID (tlc estate)"
        required: false
      TS_AUDIENCE:
        description: "Tailscale audience (tlc estate)"
        required: false

jobs:
  release:
    name: "release"
    runs-on: ubuntu-latest
    permissions:
      contents: write # checkout and release creation
      id-token: write # Tailscale workload identity
    env:
      TYPE: ${{ inputs.type }}
      ESTATE: ${{ inputs.estate }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Validate inputs
        env:
          MODULE_NAME: ${{ inputs.module_name }}
          DEPENDS: ${{ inputs.depends }}
        run: |
          set -euo pipefail
          case "${TYPE}" in
            tag-only) ;;
            debian|debian-app|tcl-module)
              case "${ESTATE}" in
                tlc|mla|qcode) ;;
                *) echo "::error::estate must be tlc, mla or qcode for type ${TYPE}"; exit 1 ;;
              esac ;;
            *) echo "::error::Unknown type '${TYPE}'"; exit 1 ;;
          esac
          if [ "${TYPE}" = "tcl-module" ] && { [ -z "${MODULE_NAME}" ] || [ -z "${DEPENDS}" ]; }; then
            echo "::error::module_name and depends are required for type tcl-module"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        uses: qcode-software/ci-development/.github/actions/version-increment@v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve paths and apt server
        id: resolve
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODULE_NAME: ${{ inputs.module_name }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          {
            echo "notes_file=${RUNNER_TEMP}/notes.md"
            echo "archive_file=${RUNNER_TEMP}/${REPO_NAME}-${VERSION}.tar.gz"
            echo "tcl_module_file=${RUNNER_TEMP}/${MODULE_NAME}-${VERSION}.tm"
          } >> "$GITHUB_OUTPUT"

          if [ "${TYPE}" != "tag-only" ]; then
            suffix="${ESTATE^^}"
            for key in USER HOST DIR; do
              value="$(jq -r --arg k "APT_REMOTE_${key}_${suffix}" '.[$k] // empty' <<< "${VARS_JSON}")"
              if [ -z "${value}" ]; then
                echo "::error::Organisation variable APT_REMOTE_${key}_${suffix} is not set"
                exit 1
              fi
              echo "remote_${key,,}=${value}" >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Seed release notes
        if: inputs.deploy_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.resolve.outputs.notes_file }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "${NOTES_FILE}"

      - name: Append deploy notes
        if: inputs.deploy_notes
        uses: qcode-software/ci-development/.github/actions/deploy-notes@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          notes_file: ${{ steps.resolve.outputs.notes_file }}

      - name: Create Tcl module
        if: inputs.type == 'tcl-module'
        uses: qcode-software/ci-development/.github/actions/tcl-module-build@v3.0.0
        with:
          source_directory: ${{ inputs.tcl_source_directory }}
          version: ${{ steps.version.outputs.version }}
          package: ${{ inputs.module_name }}
          tcl_module_file: ${{ steps.resolve.outputs.tcl_module_file }}

      - name: Create archive from Tcl module
        if: inputs.type == 'tcl-module'
        uses: qcode-software/ci-development/.github/actions/source-archive@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          archive_file: ${{ steps.resolve.outputs.archive_file }}
          tcl_module_file: ${{ steps.resolve.outputs.tcl_module_file }}

      # Archived before the .deb is built so the package is not archived with it
      - name: Create source archive
        if: inputs.type == 'debian-app'
        uses: qcode-software/ci-development/.github/actions/source-archive@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          archive_file: ${{ steps.resolve.outputs.archive_file }}
          source_directory: ${{ inputs.archive_directory }}

      - name: Create Debian package from tree
        id: deb_tree
        if: inputs.type == 'debian' || inputs.type == 'debian-app'
        uses: qcode-software/ci-development/.github/actions/debian-package-from-tree@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          source_dir: ${{ inputs.source_dir }}

      - name: Create Debian package from Tcl module
        id: deb_module
        if: inputs.type == 'tcl-module'
        uses: qcode-software/ci-development/.github/actions/debian-package-from-module@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          tcl_module_file: ${{ steps.resolve.outputs.tcl_module_file }}
          maintainer: ${{ inputs.maintainer }}
          description: ${{ inputs.description || format('{0} debian package.', github.event.repository.name) }}
          depends: ${{ inputs.depends }}

      - name: Create release
        uses: qcode-software/ci-development/.github/actions/github-release@v3.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          notes_file: ${{ inputs.deploy_notes && steps.resolve.outputs.notes_file || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Blank lines (steps that did not run) are ignored
          assets: |
            ${{ (inputs.type == 'debian-app' || inputs.type == 'tcl-module') && steps.resolve.outputs.archive_file || '' }}
            ${{ steps.deb_tree.outputs.package_file }}
            ${{ steps.deb_module.outputs.package_file }}

      - name: Upload Debian package
        if: inputs.type != 'tag-only'
        uses: qcode-software/ci-development/.github/actions/apt-upload@v3.0.0
        with:
          debian_package_file: ${{ steps.deb_tree.outputs.package_file || steps.deb_module.outputs.package_file }}
          remote_user: ${{ steps.resolve.outputs.remote_user }}
          remote_host: ${{ steps.resolve.outputs.remote_host }}
          remote_dir: ${{ steps.resolve.outputs.remote_dir }}
          distribution: ${{ inputs.distribution }}
          private_key: ${{ inputs.estate == 'mla' && secrets.MLA_DEB_PRIVATE_KEY || inputs.estate == 'qcode' && secrets.DEB_PRIVATE_KEY || '' }}
          tailscale_oauth_client_id: ${{ inputs.estate == 'tlc' && secrets.TS_OAUTH_CLIENT_ID || '' }}
          tailscale_audience: ${{ inputs.estate == 'tlc' && secrets.TS_AUDIENCE || '' }}
